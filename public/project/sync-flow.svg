<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><rect width="1440" height="520" fill="#111111"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker></defs><rect x="40" y="150" width="236" height="130" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1"/><text x="158.0" y="211.0" fill="#f3f4f6" font-size="20" font-weight="700" text-anchor="middle">저장소 PROJECT.md</text><text x="158.0" y="237.0" fill="#9ca3af" font-size="15" text-anchor="middle">메타데이터 JSON + 본문</text><text x="58" y="178" fill="#60a5fa" font-size="15" font-weight="700">STEP 1</text><path d="M276 215H314" fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#a)"/><rect x="316" y="150" width="236" height="130" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1"/><text x="434.0" y="211.0" fill="#f3f4f6" font-size="20" font-weight="700" text-anchor="middle">portfolio-hub</text><text x="434.0" y="237.0" fill="#9ca3af" font-size="15" text-anchor="middle">필드 검증 후 전송</text><text x="334" y="178" fill="#60a5fa" font-size="15" font-weight="700">STEP 2</text><path d="M552 215H590" fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#a)"/><rect x="592" y="150" width="236" height="130" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1"/><text x="710.0" y="211.0" fill="#f3f4f6" font-size="20" font-weight="700" text-anchor="middle">PUT /service/project</text><text x="710.0" y="237.0" fill="#9ca3af" font-size="15" text-anchor="middle">서비스 토큰 검증 (project:write)</text><text x="610" y="178" fill="#60a5fa" font-size="15" font-weight="700">STEP 3</text><path d="M828 215H866" fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#a)"/><rect x="868" y="150" width="236" height="130" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="1"/><text x="986.0" y="211.0" fill="#e0e7ff" font-size="20" font-weight="700" text-anchor="middle">트랜잭션 upsert</text><text x="986.0" y="237.0" fill="#9ca3af" font-size="15" text-anchor="middle">slug 기준 저장 + 태그 동기화</text><text x="886" y="178" fill="#60a5fa" font-size="15" font-weight="700">STEP 4</text><path d="M1104 215H1142" fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#a)"/><rect x="1144" y="150" width="236" height="130" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1"/><text x="1262.0" y="211.0" fill="#f3f4f6" font-size="20" font-weight="700" text-anchor="middle">GET /project/{slug}</text><text x="1262.0" y="237.0" fill="#9ca3af" font-size="15" text-anchor="middle">웹 상세 화면에서 조회</text><text x="1162" y="178" fill="#60a5fa" font-size="15" font-weight="700">STEP 5</text><text x="720" y="70" fill="#f3f4f6" font-size="26" font-weight="700" text-anchor="middle">프로젝트 소개가 공개 화면에 반영되는 길</text><text x="720" y="102" fill="#9ca3af" font-size="17" text-anchor="middle">개인 프로젝트는 저장소 문서가 원본이고, API는 같은 slug를 한 번에 하나만 갱신합니다</text><rect x="622" y="320" width="542" height="150" rx="12" fill="#1f2937" stroke="#374151"/><text x="642" y="362" fill="#d1d5db" font-size="17">• 회사 프로젝트(company)는 거부 (409)</text><text x="642" y="400" fill="#d1d5db" font-size="17">• 이미지를 보내지 않으면 기존 이미지 유지</text><text x="642" y="438" fill="#d1d5db" font-size="17">• 변경이 없으면 unchanged로 응답</text><path d="M986.0 320V282" fill="none" stroke="#8a8f98" stroke-width="2" stroke-dasharray="5 5"/></svg>